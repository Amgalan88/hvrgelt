<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="hvrgelt.mn хүргэгч">
  <!-- Түр зуурын дүрс. AI-аар зурсан hvrgelt.mn хувцастай ажилчны зургийг
       public/mascot.png нэрээр байрлуулбал автоматаар тэр нь харагдана. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ff5a1f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="118" fill="url(#bg)"/>

  <!-- бие / хүргэгчийн хантааз -->
  <path d="M64 226c0-34 25-58 56-58s56 24 56 58z" fill="#ff5a1f"/>
  <path d="M104 172h32l-16 26z" fill="#ffffff" opacity=".85"/>
  <rect x="150" y="186" width="26" height="12" rx="3" fill="#ffffff" opacity=".55"/>

  <!-- гар, баглаа -->
  <rect x="150" y="150" width="52" height="46" rx="7" fill="#c98a52"/>
  <path d="M150 168h52" stroke="#a9703f" stroke-width="5"/>
  <path d="M176 150v46" stroke="#a9703f" stroke-width="5"/>

  <!-- толгой -->
  <circle cx="120" cy="116" r="42" fill="#f3c6a0"/>
  <!-- малгай -->
  <path d="M78 106a42 42 0 0 1 84 0z" fill="#1a2035"/>
  <path d="M74 106h56v10H74z" fill="#0f1526"/>
  <circle cx="120" cy="88" r="7" fill="#ff5a1f"/>

  <!-- нүүр — инээмсэглэл -->
